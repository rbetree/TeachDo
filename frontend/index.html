<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ai2ppt - 一键生成演示文稿（幻灯片）应用，实现在线PPT的编辑、演示，支持导出PPT文件，支持AI生成PPT。" />
    <meta name="keywords" content="ai2ppt,ppt,powerpoint,在线ppt,幻灯片,演示文稿,ppt在线制作,aippt" />
    <title>ai2ppt</title>

    <style>
      /* 首屏加载阶段的设计系统变量，需与 design-tokens.scss 保持一致 */
      :root {
        /* Light theme (default) */
        --bg-body: #ffffff;
        --bg-surface-secondary: #f4f4f4;
        --text-primary: #111111;
        --primary-color: #000000;
      }
      body {
        background-color: var(--bg-body);
        transition: background-color 0.3s ease;
      }
      [data-theme="dark"] {
        /* Dark theme */
        --bg-body: #050505;
        --bg-surface-secondary: #1a1a1a;
        --text-primary: #e5e5e5;
        --primary-color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg-body: #050505;
          --bg-surface-secondary: #1a1a1a;
          --text-primary: #e5e5e5;
          --primary-color: #ffffff;
        }
      }
      .first-screen-loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 24px;
      }
      .spinner {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 4px solid var(--bg-surface-secondary);
        border-top-color: var(--primary-color);
        animation: spin 1s linear infinite;
      }
      .loading-text {
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--text-primary);
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="first-screen-loading">
        <div class="spinner"></div>
        <div class="loading-text">正在加载...</div>
      </div>
    </div>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('app-theme');
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          console.warn('Failed to apply initial theme.', e);
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>

  <script>
    document.oncontextmenu = e => e.preventDefault()
  </script>
</html>
