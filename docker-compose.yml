# 根目录 Docker Compose（推荐）
#
# 使用方式：
#   1) cp env_template.txt .env  # 并填入你的 API Key
#   2) docker compose up --build
#
# 约定：
# - 运行期数据写入 ./var（缓存/临时文件）
# - 日志写入 ./logs
services:
  outline_api:
    image: "${TEACHDO_IMAGE_PREFIX:-teachdo}-outline_api:${TEACHDO_IMAGE_TAG:-latest}"
    build:
      context: ./backend/simpleOutline
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}"
    ports:
      - "10001:10001"
    env_file:
      - .env
    command: >
      python main_api.py
      --host 0.0.0.0
      --port 10001
      --agent_url http://outline_api:10001/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10001/.well-known/agent.json', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./var:/app/var
      - ./logs:/app/logs
      - ./backend/common:/app/backend/common:ro

  content_api:
    image: "${TEACHDO_IMAGE_PREFIX:-teachdo}-content_api:${TEACHDO_IMAGE_TAG:-latest}"
    build:
      context: ./backend/slide_agent
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}"
    ports:
      - "10011:10011"
    env_file:
      - .env
    command: >
      python main_api.py
      --host 0.0.0.0
      --port 10011
      --agent_url http://content_api:10011/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10011/.well-known/agent.json', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./var:/app/var
      - ./logs:/app/logs
      - ./backend/common:/app/backend/common:ro

  personaldb:
    image: "${TEACHDO_IMAGE_PREFIX:-teachdo}-personaldb:${TEACHDO_IMAGE_TAG:-latest}"
    build:
      context: ./backend/personaldb
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}"
    ports:
      - "9100:9100"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./var:/app/var
      - ./logs:/app/logs
      - ./backend/common:/app/backend/common:ro

  main_api:
    image: "${TEACHDO_IMAGE_PREFIX:-teachdo}-main_api:${TEACHDO_IMAGE_TAG:-latest}"
    build:
      context: ./backend/main_api
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}"
    ports:
      - "6800:6800"
    env_file:
      - .env
    environment:
      OUTLINE_API: http://outline_api:10001
      CONTENT_API: http://content_api:10011
      PERSONAL_DB: http://personaldb:9100
    depends_on:
      outline_api:
        condition: service_healthy
      content_api:
        condition: service_healthy
      personaldb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6800/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./var:/app/var
      - ./logs:/app/logs
      - ./backend/common:/app/backend/common:ro

  frontend:
    image: "${TEACHDO_IMAGE_PREFIX:-teachdo}-frontend:${TEACHDO_IMAGE_TAG:-latest}"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5174}:8080"
    depends_on:
      - main_api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
